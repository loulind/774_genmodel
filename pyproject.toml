[project]
name = "genmodel-agent"
version = "0.1.0"
description = "An AI agent that decides whether and how to apply generative modeling to a dataset, given a user objective"
readme = "README.md"
# Pinned to 3.12 for parity with Project 1 and wheel availability (torch, scanpy).
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- numerical core ---
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",

    # --- deep learning (MPS on Apple silicon, CUDA elsewhere) ---
    "torch>=2.4",

    # --- data sources ---
    "scanpy>=1.10",
    "anndata>=0.10",
    "medmnist>=3.0",

    # --- reporting ---
    "matplotlib>=3.8",
    "markdown>=3.5",
    "pyyaml>=6.0",

    # --- agent scaffolding ---
    "pydantic>=2.6",
    "claude-agent-sdk",
    "anyio>=4.0",
]

[project.scripts]
genagent = "genmodel_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genmodel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
